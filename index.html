<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F4F7FD;color:#0B1B3F}
.wrap{max-width:520px;margin:auto;padding:0 18px}
.top{background:#0B1B3F;color:#fff;padding:20px 0 70px}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 26px}.brand .tile{width:44px;height:44px;flex:none}.brand .word{height:27px;width:auto}

.sport input{position:absolute;opacity:0}.sport span{display:block;text-align:center;padding:14px;border-radius:12px;border:2px solid #E2E8F0;background:#fff;cursor:pointer;font-size:16px}
.sport input:checked+span{border-color:#2563EB;background:#DBEAFE}.sport input:focus-visible+span{outline:2px solid #2563EB;outline-offset:2px}
.lvl{display:none;margin-top:8px}.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;color:#475569}
.chk input{width:auto;margin-top:3px;accent-color:#2563EB}button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:12px;background:#2563EB;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
button:hover{background:#1D4ED8}button:disabled{opacity:.75;cursor:default}
#ok{display:none;text-align:center;padding:30px 10px}#ok h2{margin-top:0}small{color:#64748B}

<h1>Nemaš s kim da igraš? 🎾🏀⚽</h1>
<p class="sub">Prijavi se i nađi partnera na svom nivou u Beogradu. Prijave su otvorene.</p>
</div></header>
<main class="wrap">
<form id="f" class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Ime</label><input name="ime" required></div><div><label>Prezime</label><input name="prezime" required></div></div><label>Nadimak <span style="font-weight:400;font-size:13px;color:#64748B">(nije obavezno)</span></label><input name="nadimak" placeholder="Kako da te zovu u igri">
<label>Šta igraš? (može više)</label>
<div class="sports">
<label class="sport"><input type="checkbox" name="sport" value="Tenis"><span><svg width="26" height="26" style="vertical-align:-7px" aria-hidden="true" viewBox="0 0 64 64"><defs><linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs><g transform="rotate(-35 32 32)"><rect x="29" y="40" width="6" height="20" rx="3" fill="#334155"/><rect x="29" y="47" width="6" height="2" fill="#64748B"/><rect x="29" y="52" width="6" height="2" fill="#64748B"/><rect x="29" y="57" width="6" height="2" fill="#64748B"/><path d="M27 36 L32 42 L37 36" fill="none" stroke="#334155" stroke-width="2.5"/><ellipse cx="32" cy="20" rx="15" ry="18" fill="url(#gt)" fill-opacity=".35" stroke="#0B1B3F" stroke-width="2.5"/><g stroke="#2563EB" stroke-width="1.2"><line x1="22" y1="6" x2="22" y2="34"/><line x1="27" y1="3" x2="27" y2="37"/><line x1="32" y1="2" x2="32" y2="38"/><line x1="37" y1="3" x2="37" y2="37"/><line x1="42" y1="6" x2="42" y2="34"/><line x1="18" y1="10" x2="46" y2="10"/><line x1="17" y1="15" x2="47" y2="15"/><line x1="17" y1="20" x2="47" y2="20"/><line x1="17" y1="25" x2="47" y2="25"/><line x1="18" y1="30" x2="46" y2="30"/></g></g><circle cx="53" cy="11" r="6.5" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/><path d="M47.5 8.5 Q53 12.5 58.5 8.5" stroke="#fff" stroke-width="1.3" fill="none"/></svg> Tenis</span></label>
<label class="sport"><input type="checkbox" name="sport" value="Košarka"><span><svg width="26" height="26" style="vertical-align:-7px" aria-hidden="true" viewBox="0 0 64 64"><defs><linearGradient id="gk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs><circle cx="32" cy="32" r="24" fill="url(#gk)" stroke="#0B1B3F" stroke-width="2.5"/><g fill="none" stroke="#0f172a" stroke-width="2.2" opacity=".85"><line x1="8" y1="32" x2="56" y2="32"/><line x1="32" y1="8" x2="32" y2="56"/><path d="M15 15 Q25 32 15 49"/><path d="M49 15 Q39 32 49 49"/></g></svg> Košarka</span></label>
<label class="sport"><input type="checkbox" name="sport" value="Padel"><span><svg width="26" height="26" style="vertical-align:-7px" aria-hidden="true" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs><g transform="rotate(-35 32 32)"><rect x="28.5" y="42" width="7" height="18" rx="3" fill="#334155"/><rect x="28.5" y="46" width="7" height="2" fill="#64748B"/><rect x="28.5" y="51" width="7" height="2" fill="#64748B"/><rect x="28.5" y="56" width="7" height="2" fill="#64748B"/><path d="M26 38 L32 45 L38 38 Z" fill="#334155"/><path d="M32 4 C46 4 52 14 52 23 C52 33 44 40 32 40 C20 40 12 33 12 23 C12 14 18 4 32 4 Z" fill="url(#g)" stroke="#0B1B3F" stroke-width="2.5"/><g fill="#0f172a" opacity=".85"><circle cx="25" cy="13" r="1.8"/><circle cx="32" cy="12" r="1.8"/><circle cx="39" cy="13" r="1.8"/><circle cx="21" cy="20" r="1.8"/><circle cx="28" cy="19.5" r="1.8"/><circle cx="36" cy="19.5" r="1.8"/><circle cx="43" cy="20" r="1.8"/><circle cx="21" cy="27" r="1.8"/><circle cx="28" cy="26.5" r="1.8"/><circle cx="36" cy="26.5" r="1.8"/><circle cx="43" cy="27" r="1.8"/><circle cx="26" cy="33" r="1.8"/><circle cx="32" cy="33.5" r="1.8"/><circle cx="38" cy="33" r="1.8"/></g></g><circle cx="53" cy="11" r="6.5" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/><path d="M47.5 8.5 Q53 12.5 58.5 8.5" stroke="#fff" stroke-width="1.3" fill="none"/></svg> Padel</span></label>
<label class="sport"><input type="checkbox" name="sport" value="Fudbal"><span><svg width="26" height="26" style="vertical-align:-7px" aria-hidden="true" viewBox="0 0 64 64"><defs><linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs><circle cx="32" cy="32" r="24" fill="url(#gf)" stroke="#0B1B3F" stroke-width="2.5"/><polygon points="32,22 41.5,29 38,40 26,40 22.5,29" fill="#0f172a" opacity=".85"/><g stroke="#0f172a" stroke-width="2.2" opacity=".85"><line x1="32" y1="22" x2="32" y2="9"/><line x1="41.5" y1="29" x2="54" y2="25"/><line x1="38" y1="40" x2="46" y2="51"/><line x1="26" y1="40" x2="18" y2="51"/><line x1="22.5" y1="29" x2="10" y2="25"/></g></svg> Fudbal</span></label>
</div>
<div id="levels"></div>
<label>Koji sport ti je glavni?</label><select name="glavni" id="glavni" required><option value="">Prvo izaberi sportove</option></select>
<label>Deo Beograda</label><select name="deo" required><option value="">Izaberi</option>
<option>Novi Beograd</option><option>Zemun</option><option>Vračar</option><option>Stari grad</option><option>Zvezdara</option><option>Voždovac</option><option>Čukarica</option><option>Palilula</option><option>Savski venac</option><option>Rakovica</option><option>Drugo</option></select>
<label>Kad možeš da igraš? (može više)</label>
<div class="sports">
<label class="sport"><input type="checkbox" name="vreme" value="Radnim danima pre 17h"><span>Radni dan pre 17h</span></label>
<label class="sport"><input type="checkbox" name="vreme" value="Radnim danima posle 17h"><span>Radni dan posle 17h</span></label>
<label class="sport"><input type="checkbox" name="vreme" value="Vikend ujutru"><span>Vikend ujutru</span></label>
<label class="sport"><input type="checkbox" name="vreme" value="Vikend popodne"><span>Vikend popodne</span></label>
</div>
<label>Mejl</label><input name="mejl" type="email" required placeholder="ime@gmail.com"><label>Telefon (nije obavezno)</label><input name="tel" type="tel" inputmode="tel" placeholder="06x xxx xxxx">
<label class="chk"><input type="checkbox" required> Slažem se da se moji podaci čuvaju radi spajanja sa partnerima i da me kontaktirate kad aplikacija krene. Podatke ne delimo sa trećim licima i možeš tražiti brisanje u bilo kom trenutku.</label>
<input type="hidden" name="izvor" id="izvor"><button>Prijavi se</button>
</form>
<div id="ok" class="card"><h2>Prijavljen si! 🎉</h2><p>Javićemo ti se čim krenemo.</p><button type="button" onclick="share()">Pošalji drugaru</button></div>
<p><small>Zaštita podataka u skladu sa Zakonom o zaštiti podataka o ličnosti.</small></p>
</main>
<script>
// Ovde nalepi adresu gde stižu prijave (npr. Formspree ili Google Apps Script). Dok je prazno, prijave se samo prikažu.
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbygrW4IC9zCGl3vArXAel0lVX5vRX8Ot-eimkfJjPhks8SJYoSOqaeiwlCdbroHn8RG/exec';
document.getElementById('izvor').value=new URLSearchParams(location.search).get('izvor')||'direktno';
const lv=document.getElementById('levels'),gl=document.getElementById('glavni');
document.querySelectorAll('input[name=sport]').forEach(c=>c.addEventListener('change',()=>{
 const s=[...document.querySelectorAll('input[name=sport]:checked')].map(x=>x.value);
 const prev={};lv.querySelectorAll('select').forEach(x=>prev[x.name]=x.value);
 lv.innerHTML=s.map(x=>`<label>Nivo: ${x}</label><select name="nivo_${x}" required><option value="">Izaberi</option><option>Početnik</option><option>Rekreativac</option><option>Srednji</option><option>Napredni</option></select>`).join('');
 lv.querySelectorAll('select').forEach(x=>{if(prev[x.name])x.value=prev[x.name]});
 gl.innerHTML=s.length?s.map(x=>`<option>${x}</option>`).join(''):'<option value="">Prvo izaberi sportove</option>';
}));
document.getElementById('f').addEventListener('submit',async e=>{
 e.preventDefault();if(e.target.dataset.s)return;const fd=new FormData(e.target);{const m=(fd.get('mejl')||'').trim(),t=(fd.get('tel')||'').trim();fd.set('kontakt',t?m+', '+t:m);fd.delete('mejl');fd.delete('tel')}
 if(!fd.getAll('sport').length){alert('Izaberi bar jedan sport');return}
 e.target.dataset.s=1;const b=e.target.querySelector('[type=submit],button:not([type=button])');if(b){b.disabled=true;b.textContent='Šaljem…'}
 if(ENDPOINT){await fetch(ENDPOINT,{method:'POST',body:new URLSearchParams(fd),mode:'no-cors'})}
 e.target.style.display='none';document.getElementById('ok').style.display='block';
});
function share(){const t='Prijavi se, nalazimo partnere za tenis, basket, padel i fudbal u Beogradu: '+location.href;
if(navigator.share)navigator.share({text:t});else location.href='https://wa.me/?text='+encodeURIComponent(t)}
</script></body></html>
